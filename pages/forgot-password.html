    </button>

<!-- FORGOT PASSWORD FORM -->
<section class="relative pt-28 pb-16 px-6 min-h-screen flex items-center">
  <div class="max-w-md mx-auto w-full">
    <div class="text-center mb-8">
      <h1 class="font-extrabold text-3xl md:text-4xl leading-tight mb-2" data-i18n="forgot.h1">Quên mật khẩu</h1>
      <p class="font-script text-2xl text-warm-600" data-i18n="forgot.tagline">Đặt lại mật khẩu của bạn</p>
    </div>

    <!-- STEP 1: verify email -->
    <form id="emailForm" class="glass rounded-3xl p-8 shadow-soft space-y-4">
      <p class="text-sm text-muted" data-i18n="forgot.email_hint">Nhập email tài khoản của bạn để tiếp tục.</p>
      <div>
        <label class="text-sm font-semibold block mb-1.5" data-i18n="login.email_label">Email</label>
        <input id="fpEmail" required type="email" class="w-full rounded-xl border border-secondary-100 px-4 py-3 outline-none focus:border-secondary bg-white" placeholder="ban@email.com">
      </div>
      <p id="emailError" class="form-error text-sm text-red-600 font-medium"></p>
      <button id="emailSubmitBtn" type="submit" disabled class="w-full bg-ink text-white font-semibold py-3.5 rounded-full hover:-translate-y-0.5 hover:shadow-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none" data-i18n="forgot.continue">Tiếp tục</button>
      <p class="text-sm text-muted text-center pt-1"><a href="login.html" class="text-secondary font-semibold hover:underline" data-i18n="forgot.back_to_login">Quay lại đăng nhập</a></p>
    </form>

    <!-- STEP 2: set new password -->
    <form id="resetForm" class="hidden glass rounded-3xl p-8 shadow-soft space-y-4">
      <p class="text-sm text-muted" data-i18n-html="forgot.reset_hint">Đặt mật khẩu mới cho tài khoản <span id="resetEmailLabel" class="font-semibold text-ink"></span>.</p>
      <div>
        <label class="text-sm font-semibold block mb-1.5" data-i18n="forgot.new_password_label">Mật khẩu mới</label>
        <input id="fpNewPassword" required minlength="8" type="password" class="w-full rounded-xl border border-secondary-100 px-4 py-3 outline-none focus:border-secondary bg-white" placeholder="••••••••">
      </div>
      <div>
        <label class="text-sm font-semibold block mb-1.5" data-i18n="forgot.confirm_password_label">Xác nhận mật khẩu mới</label>
        <input id="fpConfirmPassword" required minlength="8" type="password" class="w-full rounded-xl border border-secondary-100 px-4 py-3 outline-none focus:border-secondary bg-white" placeholder="••••••••">
      </div>
      <p id="resetError" class="form-error text-sm text-red-600 font-medium"></p>
      <button id="resetSubmitBtn" type="submit" disabled class="w-full bg-ink text-white font-semibold py-3.5 rounded-full hover:-translate-y-0.5 hover:shadow-lg transition-all disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none" data-i18n="forgot.submit">Đặt lại mật khẩu</button>
    </form>
  </div>
</section>

<script>
  document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('mobileMenu')?.classList.toggle('hidden'));

  async function api(url, options = {}) {
    const res = await fetch(url, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Đã có lỗi xảy ra.');
    return data;
  }

  const emailForm = document.getElementById('emailForm');
  const resetForm = document.getElementById('resetForm');
  const emailSubmitBtn = document.getElementById('emailSubmitBtn');
  const resetSubmitBtn = document.getElementById('resetSubmitBtn');
  const emailError = document.getElementById('emailError');
  const resetError = document.getElementById('resetError');
  let verifiedEmail = '';

  function updateEmailSubmitState() {
    emailSubmitBtn.disabled = !emailForm.checkValidity();
  }
  emailForm.addEventListener('input', updateEmailSubmitState);
  updateEmailSubmitState();

  function updateResetSubmitState() {
    resetSubmitBtn.disabled = !resetForm.checkValidity();
  }
  resetForm.addEventListener('input', updateResetSubmitState);
  updateResetSubmitState();

  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    emailError.classList.remove('show');
    const email = document.getElementById('fpEmail').value.trim();
    try {
      await api('/api/auth/forgot-password/verify', { method: 'POST', body: { email } });
      verifiedEmail = email;
      document.getElementById('resetEmailLabel').textContent = email;
      emailForm.classList.add('hidden');
      resetForm.classList.remove('hidden');
    } catch (err) {
      emailError.textContent = err.message;
      emailError.classList.add('show');
    }
  });

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    resetError.classList.remove('show');
    const newPassword = document.getElementById('fpNewPassword').value;
    const confirmPassword = document.getElementById('fpConfirmPassword').value;
    if (newPassword !== confirmPassword) {
      resetError.textContent = window.I18N ? window.I18N.t('forgot.mismatch_error') : 'Mật khẩu xác nhận không khớp.';
      resetError.classList.add('show');
      return;
    }
    try {
      await api('/api/auth/forgot-password/reset', { method: 'POST', body: { email: verifiedEmail, newPassword } });
      window.location.href = 'login.html?reset=1';
    } catch (err) {
      resetError.textContent = err.message;
      resetError.classList.add('show');
    }
  });
</script>
</body>
</html>
