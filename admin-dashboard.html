<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng điều khiển quản trị – Material AI</title>
<link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="images/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { primary:'#FFFFFF', secondary:{DEFAULT:'#3A3632',50:'#F2F0EE',100:'#E3DFDA',600:'#2C2925',700:'#201E1A'}, accent:{DEFAULT:'#9AA3A4',50:'#F1F2F0',100:'#E3E6E4',600:'#7D8688'}, cream:'#FBF6F0', ink:'#211E1A', muted:'#6B6259' },
    fontFamily: { heading:['Inter','sans-serif'], body:['Roboto','sans-serif'] },
    boxShadow: { soft:'0 10px 40px -10px rgba(33,30,26,0.15)' },
  }}}
</script>
<style>
  body{font-family:'Roboto',sans-serif;color:#211E1A;background:#FBF6F0}
  h1,h2,h3,h4,.font-heading{font-family:'Inter',sans-serif}
  .font-script{font-family:'Inter',sans-serif;font-style:italic;font-weight:700}
  .glass{background:rgba(251,247,242,.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(251,247,242,.6)}
  .hidden{display:none}
  .tab-btn.active{background:#3A3632;color:#fff}
  .badge-pending{background:#F1F2F0;color:#7D8688}
  .badge-approved{background:#EAF3EA;color:#3E7A45}
  .badge-blocked{background:#FBE9E7;color:#B3261E}
</style>
</head>
<body class="bg-cream text-ink overflow-x-hidden min-h-screen">

<!-- NAVBAR -->
<header class="fixed top-3 md:top-5 inset-x-3 md:inset-x-6 z-50">
  <nav class="max-w-7xl mx-auto flex items-center justify-between gap-4 px-4 md:px-5 py-2 glass rounded-full shadow-soft">
    <a href="index.html" class="flex items-center shrink-0"><img src="images/LOGO.png" alt="MateriAI" class="h-10 md:h-12 w-auto"></a>
    <div class="hidden sm:block text-sm font-semibold text-secondary">Bảng điều khiển quản trị</div>
    <div class="flex items-center gap-3">
      <span id="userGreeting" class="hidden sm:inline text-sm text-muted"></span>
      <button id="logoutBtn" class="border border-secondary-100 text-secondary px-4 py-2 rounded-full text-sm font-semibold hover:bg-secondary-50 transition-colors">Đăng xuất</button>
    </div>
  </nav>
</header>

<section class="relative pt-28 pb-16 px-6">
  <div class="max-w-6xl mx-auto">

    <div class="mb-8">
      <h1 class="font-extrabold text-3xl md:text-4xl leading-tight mb-1">Quản trị hệ thống</h1>
      <p class="font-script text-2xl text-accent-600">toàn cảnh Material AI</p>
    </div>

    <!-- STATS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
      <div class="bg-white rounded-2xl p-5 shadow-soft text-center">
        <p class="font-script text-4xl text-accent-600" id="statTotalSellers">0</p>
        <p class="text-xs text-muted mt-1">Tổng nhà bán hàng</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-soft text-center">
        <p class="font-script text-4xl text-secondary" id="statPending">0</p>
        <p class="text-xs text-muted mt-1">Chờ duyệt</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-soft text-center">
        <p class="font-script text-4xl text-secondary" id="statApproved">0</p>
        <p class="text-xs text-muted mt-1">Đã duyệt</p>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-soft text-center">
        <p class="font-script text-4xl text-accent-600" id="statMaterials">0</p>
        <p class="text-xs text-muted mt-1">Tổng vật liệu</p>
      </div>
    </div>

    <!-- TABS -->
    <div class="flex gap-3 mb-6">
      <button class="tab-btn active px-5 py-2 rounded-full font-semibold text-sm border border-secondary-100" data-tab="sellers">Nhà bán hàng</button>
      <button class="tab-btn px-5 py-2 rounded-full font-semibold text-sm border border-secondary-100" data-tab="materials">Vật liệu</button>
    </div>

    <!-- SELLERS TAB -->
    <div id="tab-sellers" class="tab-panel bg-white rounded-3xl shadow-soft p-6 md:p-8 overflow-x-auto">
      <table class="w-full text-sm min-w-[720px]">
        <thead>
          <tr class="text-left text-muted border-b border-secondary-50">
            <th class="pb-3 font-semibold">Nhà bán hàng</th>
            <th class="pb-3 font-semibold">Ngành hàng</th>
            <th class="pb-3 font-semibold">Vật liệu</th>
            <th class="pb-3 font-semibold">Trạng thái</th>
            <th class="pb-3 font-semibold text-right">Hành động</th>
          </tr>
        </thead>
        <tbody id="sellersTableBody"></tbody>
      </table>
    </div>

    <!-- MATERIALS TAB -->
    <div id="tab-materials" class="tab-panel hidden bg-white rounded-3xl shadow-soft p-6 md:p-8 overflow-x-auto">
      <table class="w-full text-sm min-w-[720px]">
        <thead>
          <tr class="text-left text-muted border-b border-secondary-50">
            <th class="pb-3 font-semibold">Vật liệu</th>
            <th class="pb-3 font-semibold">Nhà bán hàng</th>
            <th class="pb-3 font-semibold">Danh mục</th>
            <th class="pb-3 font-semibold">Giá</th>
            <th class="pb-3 font-semibold text-right">Hành động</th>
          </tr>
        </thead>
        <tbody id="materialsTableBody"></tbody>
      </table>
    </div>

  </div>
</section>

<script>
  async function api(url, options = {}) {
    const res = await fetch(url, {
      method: options.method || 'GET',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Đã có lỗi xảy ra.');
    return data;
  }

  const CAT_LABELS = { van: 'Ván công nghiệp', son: 'Sơn', gach: 'Gạch', da: 'Đá', kinh: 'Kính', go: 'Gỗ tự nhiên' };
  const STATUS_LABELS = { pending: 'Chờ duyệt', approved: 'Đã duyệt', blocked: 'Bị khóa' };

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
    });
  });

  async function loadStats() {
    const s = await api('/api/admin/stats');
    document.getElementById('statTotalSellers').textContent = s.totalSellers;
    document.getElementById('statPending').textContent = s.pendingSellers;
    document.getElementById('statApproved').textContent = s.approvedSellers;
    document.getElementById('statMaterials').textContent = s.totalMaterials;
  }

  function sellerRow(s) {
    const tr = document.createElement('tr');
    tr.className = 'border-b border-secondary-50 last:border-0';
    tr.innerHTML = `
      <td class="py-3 pr-3">
        <p class="font-semibold">${s.business_name}</p>
        <p class="text-xs text-muted">${s.email}</p>
      </td>
      <td class="py-3 pr-3">${CAT_LABELS[s.category] || s.category}</td>
      <td class="py-3 pr-3">${s.materials_count}</td>
      <td class="py-3 pr-3"><span class="text-xs font-semibold px-3 py-1 rounded-full badge-${s.status}">${STATUS_LABELS[s.status]}</span></td>
      <td class="py-3 text-right whitespace-nowrap">
        ${s.status !== 'approved' ? `<button data-id="${s.id}" data-status="approved" class="set-status text-xs font-semibold text-secondary hover:underline mr-3">Duyệt</button>` : ''}
        ${s.status !== 'blocked' ? `<button data-id="${s.id}" data-status="blocked" class="set-status text-xs font-semibold text-red-600 hover:underline mr-3">Khóa</button>` : `<button data-id="${s.id}" data-status="approved" class="set-status text-xs font-semibold text-secondary hover:underline mr-3">Mở khóa</button>`}
        <button data-id="${s.id}" class="delete-seller text-xs font-semibold text-muted hover:underline">Xóa</button>
      </td>`;
    return tr;
  }

  async function loadSellers() {
    const { sellers } = await api('/api/admin/sellers');
    const body = document.getElementById('sellersTableBody');
    body.innerHTML = '';
    sellers.forEach(s => body.appendChild(sellerRow(s)));

    body.querySelectorAll('.set-status').forEach(btn => {
      btn.addEventListener('click', async () => {
        await api('/api/admin/sellers/' + btn.dataset.id + '/status', { method: 'PUT', body: { status: btn.dataset.status } });
        loadSellers();
        loadStats();
      });
    });
    body.querySelectorAll('.delete-seller').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Xóa nhà bán hàng này? Toàn bộ vật liệu của họ cũng sẽ bị xóa.')) return;
        await api('/api/admin/sellers/' + btn.dataset.id, { method: 'DELETE' });
        loadSellers();
        loadStats();
        loadMaterials();
      });
    });
  }

  function materialRow(m) {
    const tr = document.createElement('tr');
    tr.className = 'border-b border-secondary-50 last:border-0';
    tr.innerHTML = `
      <td class="py-3 pr-3">
        <p class="font-semibold">${m.title}</p>
        <p class="text-xs text-muted">${m.spec || ''}</p>
      </td>
      <td class="py-3 pr-3">${m.seller_name}</td>
      <td class="py-3 pr-3">${CAT_LABELS[m.category] || m.category}</td>
      <td class="py-3 pr-3 font-heading font-bold text-accent-600">${m.price || ''}</td>
      <td class="py-3 text-right"><button data-id="${m.id}" class="delete-material text-xs font-semibold text-red-600 hover:underline">Xóa</button></td>`;
    return tr;
  }

  async function loadMaterials() {
    const { materials } = await api('/api/admin/materials');
    const body = document.getElementById('materialsTableBody');
    body.innerHTML = '';
    materials.forEach(m => body.appendChild(materialRow(m)));
    body.querySelectorAll('.delete-material').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Xóa vật liệu này?')) return;
        await api('/api/admin/materials/' + btn.dataset.id, { method: 'DELETE' });
        loadMaterials();
        loadStats();
      });
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api('/api/auth/logout', { method: 'POST' });
    window.location.href = 'login.html';
  });

  (async function init() {
    try {
      const { user } = await api('/api/auth/me');
      if (user.role !== 'admin') { window.location.href = 'seller-dashboard.html'; return; }
      document.getElementById('userGreeting').textContent = user.email;
      await Promise.all([loadStats(), loadSellers(), loadMaterials()]);
    } catch (err) {
      window.location.href = 'login.html';
    }
  })();
</script>
</body>
</html>
